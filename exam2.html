<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 시나공 프로그래밍기능사 - 2회 모의고사</title>
    <style>
        :root { --primary: #0f766e; --correct: #22c55e; --wrong: #ef4444; --bg: #f0fdfa; }
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; line-height: 1.6; }
        .container { max-width: 720px; width: 100%; background: white; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 30px; }
        h1 { font-size: 1.6rem; color: var(--primary); text-align: center; margin-bottom: 25px; border-bottom: 2px solid #ccfbf1; padding-bottom: 15px; }
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #57606a; background: #f3f4f6; padding: 10px 15px; border-radius: 8px; }
        .question-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 15px; word-break: keep-all; }
        .code-box { background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 0.95rem; margin: 10px 0 20px; white-space: pre-wrap; overflow-x: auto; position: relative; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn { padding: 16px; border: 2px solid #e2e8f0; background: white; border-radius: 10px; cursor: pointer; text-align: left; font-size: 1rem; transition: all 0.2s; position: relative; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0fdfa; }
        .option-btn.correct { border-color: var(--correct); background: #dcfce7; color: #14532d; font-weight: bold; }
        .option-btn.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }
        .option-btn.correct::after { content: "✅"; position: absolute; right: 15px; }
        .option-btn.wrong::after { content: "❌"; position: absolute; right: 15px; }
        .feedback-area { margin-top: 25px; padding: 20px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; display: none; animation: fadeIn 0.3s; }
        .feedback-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; display: block; }
        .btn { background: var(--primary); color: white; padding: 14px 28px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: opacity 0.2s; width: 100%; margin-top: 20px; }
        .btn:hover { opacity: 0.9; }
        .hidden { display: none; }
        .score-box { text-align: center; padding: 50px 20px; }
        .score-number { font-size: 4rem; font-weight: 800; color: var(--primary); margin: 20px 0; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 모바일 최적화 */
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.3rem; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-view">
        <h1>2회 최종점검 모의고사</h1>
        <div class="status-bar">
            <span id="progress">문제 1 / 60</span>
            <span id="score">현재 점수: 0</span>
        </div>
        
        <div class="question-box">
            <div id="question-content"></div>
        </div>
        
        <div class="options-grid" id="options"></div>
        
        <div class="feedback-area" id="feedback">
            <span class="feedback-title">💡 해설 및 정답</span>
            <div id="explanation"></div>
            <button class="btn" id="next-btn" onclick="nextQuestion()">다음 문제 ➔</button>
        </div>
    </div>

    <div id="result-view" class="hidden score-box">
        <h2>시험 종료! 수고하셨습니다.</h2>
        <div class="score-number" id="final-score">0점</div>
        <p>총 60문제 중 <span id="correct-count" style="font-weight:bold; color:var(--primary)">0</span>개를 맞췄습니다.</p>
        <p id="pass-fail" style="font-size: 1.2rem; font-weight: bold; margin-top: 20px;"></p>
        <button class="btn" onclick="location.reload()">다시 풀기 (문제 섞기)</button>
    </div>
</div>

                { text: "각 시스템마다 별도의 백업 장비가 필요하지 않다.", isCorrect: true }
            ],
            desc: "직접 연결 방식은 각 컴퓨터마다 백업 장치(USB 등)를 연결해야 하므로 별도 장비가 필요합니다."
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initQuiz() {
        currentQuestions = JSON.parse(JSON.stringify(rawData));
        shuffleArray(currentQuestions);
        currentIndex = 0;
        score = 0;
        document.getElementById('quiz-view').classList.remove('hidden');
        document.getElementById('result-view').classList.add('hidden');
        renderQuestion();
        updateStatus();
    }

    function renderQuestion() {
        const qData = currentQuestions[currentIndex];
        let html = `<div class="question-text">Q${currentIndex + 1}. ${qData.q}</div>`;
        if (qData.code) {
            html += `<div class="code-box">${qData.code}</div>`;
        }
        document.getElementById('question-content').innerHTML = html;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        
        let options = [...qData.a];
        shuffleArray(options);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect, qData.a, qData.desc);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
    }

    function checkAnswer(selectedBtn, isCorrect, allOptions, explanation) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            btns.forEach(btn => {
                const correctOpt = allOptions.find(o => o.isCorrect);
                if (btn.textContent === correctOpt.text) {
                    btn.classList.add('correct');
                }
            });
        }

        document.getElementById('feedback').style.display = 'block';
        document.getElementById('explanation').textContent = explanation;
        document.getElementById('next-btn').classList.remove('hidden');
        updateStatus();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            renderQuestion();
            updateStatus();
        } else {
            showResult();
        }
    }

    function updateStatus() {
        document.getElementById('progress').textContent = `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('score').textContent = `현재 점수: ${score * 1.6 > 100 ? 100 : Math.round(score * (100/60))}`;
    }

    function showResult() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        
        const finalScore = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('final-score').textContent = finalScore + '점';
        document.getElementById('correct-count').textContent = score;
        
        const msg = document.getElementById('pass-fail');
        if (finalScore >= 60) {
            msg.textContent = "🎉 합격입니다! (60점 이상)";
            msg.style.color = "var(--correct)";
        } else {
            msg.textContent = "⚠️ 불합격입니다. (60점 미만)";
            msg.style.color = "var(--wrong)";
        }
    }

    initQuiz();
</script>

</body>
</html>
